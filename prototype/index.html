<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StrideAI Watch Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="watch" aria-label="StrideAI watch prototype">
    <section class="screen" id="screen">
      <div class="status"><span>StrideAI</span><span>82%</span></div>
      <div class="clock" id="clock">12:00</div>
      <div class="date" id="date">TUE · SEP 15</div>
      <div class="cards">
        <div class="card"><span>RUN</span><strong>8:02</strong><small>/mi</small></div>
        <div class="card"><span>HR</span><strong>149</strong><small>bpm</small></div>
      </div>
      <button class="run" id="run">START RUN</button>
    </section>
    <div class="nav"><button data-page="home">HOME</button><button data-page="run">RUN</button><button data-page="workout">WORKOUT</button><button data-page="coach">COACH</button></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
