<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#050608" />
  <title>StrideAI Watch Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <section class="watch" aria-label="StrideAI HooWel watch prototype">
      <div class="screen" id="screen"></div>
      <nav class="nav" aria-label="Watch navigation">
        <button data-page="home" aria-label="Home">⌂</button>
        <button data-page="run" aria-label="Run">RUN</button>
        <button data-page="workout" aria-label="Workout">WORK</button>
        <button data-page="coach" aria-label="Coach">AI</button>
      </nav>
    </section>
    <p class="caption">StrideAI · HooWel 507 UI prototype · 240×282 target</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
